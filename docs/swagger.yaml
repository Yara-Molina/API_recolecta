  entities.Ruta:
    properties:
      conductor_id:
        description: |-
          ConductorID es el id_chofer con asignación activa (historial_asignacion_camion)
          del camión actualmente asignado a la ruta (ruta_camion). Solo lo llena GetActivas.
          swagger:description ID del conductor asignado (null si no hay asignación activa)
        example: 12
        type: integer
      created_at:
        type: string
      descripcion:
        example: Recolección zona centro
        type: string
      eliminado:
        example: false
        type: boolean
      json_ruta:
        type: string
      nombre:
        example: Ruta Centro
        type: string
      ruta_id:
        example: 1
        type: integer
    type: object
  entities.RutaActivaItem:
    properties:
      conductor_id:
        description: |-
          ID del empleado chofer con asignación activa (fecha_baja IS NULL)
          del camión más reciente de la ruta. Null si no hay asignación.
        example: 12
        type: integer
      created_at:
        example: "2026-07-22T19:30:00Z"
        type: string
      descripcion:
        example: Recolección zona centro
        type: string
      eliminado:
        example: false
