        type: integer
      camion_id:
        type: integer
      ciudadano_id:
        type: integer
      conductor_id:
        description: |-
          ConductorID/CiudadanoID: solo staff puede fijarlos libremente aqui. Si
          quien crea es ciudadano o conductor, el backend ignora estos dos
          campos y deriva el que corresponda del JWT (ver CreateAnomaliaController.go).
        type: integer
      descripcion:
        type: string
      estado:
        type: string
      fecha_reporte:
        description: 'Formato ISO 8601: YYYY-MM-DDTHH:MM:SSZ'
        example: "2026-07-22T19:30:00Z"
        type: string
      json_ruta:
        type: string
      lat:
        description: |-
          Coordenadas GPS de donde ocurrio la anomalia. Opcionales, insumo futuro
          del algoritmo genetico de rutas.
        type: number
      lon:
        type: number
      punto_id:
        type: integer
      ruta_id:
        type: integer
      tipo_anomalia:
        description: 'Valores validos: ANOMALIA | INCIDENCIA | REPORTE_CONDUCTOR |
          REPORTE_FALLA_CRITICA | SEGUIMIENTO_FALLA_CRITICA'
        example: REPORTE_CONDUCTOR
        type: string
    required:
    - descripcion
    - fecha_reporte
    - tipo_anomalia
    type: object
